<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="%CSP%" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Pardalote: see the structure of your writing</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="masthead">
      <a class="brand" href="./" aria-label="Pardalote home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" fill="#1F2723" />
          <circle cx="10" cy="11" r="2.2" fill="#fff" /><circle cx="17" cy="8.5" r="1.8" fill="#fff" />
          <circle cx="22.5" cy="13" r="2" fill="#fff" /><circle cx="13.5" cy="17" r="1.6" fill="#fff" />
          <circle cx="20" cy="20" r="1.9" fill="#fff" />
          <path d="M5 21 Q11 29 21 28 Q14 25 12 21 Z" fill="#F2B705" />
        </svg>
        <span class="brand-name">Pardalote</span>
      </a>
      <p class="tagline">See how your scientific writing is built.</p>
      <button id="open-keys" class="btn ghost" type="button">API keys</button>
    </header>

    <main id="app">
      <!-- Compose view -->
      <section id="compose" class="compose" aria-label="Your text">
        <div class="compose-text">
          <label for="text" class="field-label">Your text</label>
          <div id="dropzone" class="dropzone">
            <textarea id="text" spellcheck="false" placeholder="Paste a section or a whole manuscript here, or drop a .txt, .md or .docx file. Put headings on their own line (for example “Methods”) so Pardalote can follow your sections."></textarea>
            <div class="drop-hint" aria-hidden="true">Drop the file to load it</div>
          </div>
          <div class="text-actions">
            <label class="btn ghost file-btn">Open file…<input id="file" type="file" accept=".txt,.md,.markdown,.docx,text/plain,text/markdown,application/vnd.openxmlformats-officedocument.wordprocessingml.document" /></label>
            <button id="load-sample" class="btn ghost" type="button">Try a sample</button>
            <span id="text-stats" class="muted" aria-live="polite"></span>
          </div>
        </div>

        <aside class="compose-side" aria-label="Analysis settings">
          <fieldset class="modes">
            <legend class="field-label">What to look at</legend>
            <label class="mode">
              <input type="radio" name="mode" value="sentence" checked />
              <span class="mode-body"><strong>Sentence construction</strong>
                <span>Main and subordinate clauses, subject–verb gaps, zombie nouns, given before new.</span>
                <em>Best for a few paragraphs to one section.</em></span>
            </label>
            <label class="mode">
              <input type="radio" name="mode" value="paragraph" />
              <span class="mode-body"><strong>Paragraph flow</strong>
                <span>Topic sentences, staying on topic, and how each paragraph hands off to the next.</span>
                <em>Best for one section.</em></span>
            </label>
            <label class="mode">
              <input type="radio" name="mode" value="manuscript" />
              <span class="mode-body"><strong>Manuscript coherence</strong>
                <span>Whether your aims are carried through methods, results and discussion, and loose threads.</span>
                <em>Best for the whole paper.</em></span>
            </label>
          </fieldset>

          <div class="model-row">
            <label class="field-label" for="provider">Model</label>
            <div class="selects">
              <select id="provider">
                <option value="anthropic">Anthropic</option>
                <option value="openai">OpenAI</option>
                <option value="openrouter">OpenRouter</option>
              </select>
              <select id="model" aria-label="Model"></select>
            </div>
            <label class="check"><input id="structured" type="checkbox" checked /> Use structured output <span class="muted">(turn off only for models that don't support it)</span></label>
          </div>

          <p id="estimate" class="estimate" aria-live="polite"></p>
          <button id="run" class="btn primary" type="button">Analyse</button>
          <p id="run-note" class="note" role="status"></p>
          <p class="privacy muted">Your text goes only to the provider you pick, using your own key. <a id="privacy-link" href="#" target="_blank" rel="noopener">Their data policy</a>.</p>
        </aside>
      </section>

      <!-- Result view -->
      <section id="result" class="result" hidden aria-label="Annotated text">
        <div class="toolbar">
          <button id="back" class="btn ghost" type="button">← Edit text</button>
          <div id="legend" class="legend" role="group" aria-label="Show or hide categories"></div>
          <div class="toolbar-end">
            <span id="usage" class="muted"></span>
            <button id="export-html" class="btn ghost" type="button">Export HTML</button>
            <button id="export-md" class="btn ghost" type="button">Export findings</button>
          </div>
        </div>
        <div id="warnings" class="warnings" hidden></div>
        <div class="reading">
          <div class="page-wrap">
            <div id="summary" class="summary" hidden></div>
            <article id="page" class="page"></article>
          </div>
          <aside id="findings" class="findings" aria-label="Findings">
            <div class="findings-head">
              <h2>Findings</h2>
              <div class="kind-filter" role="group" aria-label="Filter findings">
                <label><input type="checkbox" data-kind="issue" checked /> Issues</label>
                <label><input type="checkbox" data-kind="strength" checked /> Strengths</label>
                <label><input type="checkbox" data-kind="structure" checked /> Structure</label>
              </div>
            </div>
            <ol id="findings-list" class="findings-list"></ol>
          </aside>
        </div>
      </section>

      <!-- Progress -->
      <div id="progress" class="progress" hidden role="status" aria-live="polite">
        <div class="progress-card">
          <div class="spots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <p id="progress-text">Reading your text…</p>
          <button id="cancel" class="btn ghost" type="button">Cancel</button>
        </div>
      </div>
    </main>

    <div id="popover" class="popover" role="dialog" aria-modal="false" hidden></div>

    <dialog id="keys-dialog" class="keys-dialog" aria-labelledby="keys-title">
      <form method="dialog" class="dialog-close"><button class="btn ghost" aria-label="Close">Close</button></form>
      <h2 id="keys-title">API keys</h2>
      <div id="keys-body"></div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
